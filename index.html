<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fusion Duel</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11131c;color:#f4f2ff;font-family:system-ui,Arial;touch-action:none}
button,select{font:inherit;color:inherit;background:#282b3a;border:1px solid #53586d;border-radius:9px;padding:9px 12px}
button{cursor:pointer}button:hover{background:#3a3e54}button:active{transform:scale(.97)}
#menu{position:fixed;inset:0;overflow:auto;display:grid;place-content:center;gap:14px;padding:20px;background:radial-gradient(ellipse at top,#33304f,#11131c 70%)}
h1{margin:0;text-align:center;font-size:clamp(34px,8vw,64px);letter-spacing:4px;color:#c7b5ff}#subtitle{text-align:center;color:#aeb2c6;margin:0}
#roster{display:grid;grid-template-columns:repeat(2,minmax(130px,220px));gap:10px;justify-content:center}
.card{border:2px solid #45495d;background:#1c1f2b;border-radius:12px;padding:12px;text-align:center;cursor:pointer}.card.selected{border-color:#c5aaff;background:#302a43}
.preview{height:65px;display:grid;place-items:center}.preview svg{height:62px}
.card b{display:block}.card small{color:#aeb2c6}
.settings{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.settings label{display:flex;align-items:center;gap:6px;background:#1c1f2b;border-radius:8px;padding:6px 8px}
#start{display:block;margin:auto;background:#8060d9;border:0;padding:13px 40px;font-weight:800;font-size:18px}
#help{text-align:center;color:#aeb2c6;font-size:12px;max-width:500px;margin:0 auto}
#game{display:none;position:fixed;inset:0}canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.hudside{width:min(42%,330px)}.hudside.right{text-align:right}.hudname{font-weight:800;text-shadow:0 2px 4px #000}.bar{height:14px;background:#242631;border:1px solid #777;border-radius:9px;overflow:hidden;margin-top:3px}.bar>div{height:100%;background:#65e29b;width:100%;transition:width .1s}
#centerhud{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;font-weight:800;text-shadow:0 2px 4px #000}
#pause{position:absolute;top:50px;right:12px;pointer-events:auto}
#mobile{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:end;padding:10px;gap:8px;pointer-events:none}.player-controls{display:flex;align-items:end;gap:6px;pointer-events:none}.player-controls.p2{flex-direction:row-reverse}.joy-wrap{position:relative;width:clamp(105px,20vw,150px);height:clamp(105px,20vw,150px);pointer-events:auto;touch-action:none;flex:none}.joy-base{position:absolute;inset:0;border-radius:50%;background:#262b3ddd;border:2px solid #8887a7}.joy-stick{position:absolute;width:42%;height:42%;left:29%;top:29%;border-radius:50%;background:linear-gradient(#c3c0e8,#67618f);border:2px solid #e5e0ff;pointer-events:none}.control-actions{display:grid;grid-template-columns:repeat(2,45px);gap:4px;pointer-events:auto}#mobile button{touch-action:none;min-height:38px;background:#202333e8;border:1px solid #7b7896;font-weight:800;font-size:9px;padding:4px;border-radius:10px}@media(max-width:600px){.joy-wrap{width:90px;height:90px}.control-actions{grid-template-columns:repeat(2,36px)}}
#movePad,#fightPad{display:flex;gap:7px;pointer-events:auto;align-items:end}
#mobile button{touch-action:none;min-width:50px;height:52px;background:#202333dd;border-color:#7b7896;font-weight:800}
#movePad button{width:55px;border-radius:15px}#fightPad{max-width:55%;flex-wrap:wrap;justify-content:flex-end}
#fightPad button{height:48px;min-width:57px;border-radius:14px;font-size:11px}
#overlay{display:none;position:absolute;inset:0;background:#080910d9;place-content:center;text-align:center;gap:12px}
#overlay h2{font-size:clamp(32px,7vw,55px);margin:0}
#overlay p{color:#b8bbcd}
@media(min-width:800px){#mobile button{opacity:.72}#movePad button{width:64px}#fightPad button{min-width:72px}}
</style>
</head>
<body>
<section id="menu">
<h1>FUSION DUEL</h1><p id="subtitle">Choose a fighter. Fight together. Fuse into something stronger.</p>
<div id="roster"></div>
<div class="settings">
<label>Battle <select id="mode"><option value="duo">1 vs 1</option><option value="teams">2 vs 2</option><option value="free">Free-for-all</option></select></label>
<label>Players <select id="players"><option value="1">1 player</option><option value="2">2 players</option></select></label>
<label>Weapon <select id="weapon"><option value="sword">Sword</option><option value="staff">Staff</option><option value="blaster">Blaster</option></select></label>
</div>
<button id="start">START BATTLE</button>
<p id="help">P1: A/D move, W jump, F attack, G special, E fuse. P2: arrows, ↑ jump, / attack, . special, Enter fuse.<br>On phone, use the on-screen buttons. Fusion requires a nearby teammate.</p>
</section>
<section id="game">
<canvas id="screen"></canvas>
<div id="hud">
<div class="hudside"><div class="hudname" id="leftname">PLAYER</div><div class="bar"><div id="leftbar"></div></div></div>
<div class="hudside right"><div class="hudname" id="rightname">OPPONENT</div><div class="bar"><div id="rightbar"></div></div></div>
</div>
<div id="centerhud">FUSION DUEL</div><button id="pause">MENU</button>
<div id="mobile">
<div class="player-controls p1" id="controls1"><div class="joy-wrap" data-player="1"><div class="joy-base"></div><div class="joy-stick"></div></div><div class="control-actions"><button data-player-act="1" data-act="jump">JUMP</button><button data-player-act="1" data-act="attack">ATTACK</button><button data-player-act="1" data-act="special">SPECIAL</button><button data-player-act="1" data-act="fuse">FUSE</button></div></div>
<div class="player-controls p2" id="controls2" style="display:none"><div class="joy-wrap" data-player="2"><div class="joy-base"></div><div class="joy-stick"></div></div><div class="control-actions"><button data-player-act="2" data-act="jump">JUMP</button><button data-player-act="2" data-act="attack">ATTACK</button><button data-player-act="2" data-act="special">SPECIAL</button><button data-player-act="2" data-act="fuse">FUSE</button></div></div>
</div>
<div id="overlay"><h2 id="winner">VICTORY</h2><p id="resultinfo"></p><button id="rematch">REMATCH</button><button id="back">CHARACTER SELECT</button></div>
</section>
<script>
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d');
const roster=[
{name:'Astra',color:'#f5b84d',skill:'Solar burst',weapon:'sword'},
{name:'Glacier',color:'#63d9ef',skill:'Frost wave',weapon:'staff'},
{name:'Rift',color:'#bd8cff',skill:'Blink strike',weapon:'sword'},
{name:'Circuit',color:'#9ce56d',skill:'Arc shot',weapon:'blaster'}
];
let chosen=0,actors=[],particles=[],held={},gameOn=false,last=0,mode='duo',playerSlots=1,weapon='sword',shake=0,matchOver=false;
function fighterSVG(c){return '<svg viewBox="0 0 80 100"><circle cx="40" cy="17" r="12" fill="'+c+'"/><path d="M40 30 L40 62 M40 38 L18 53 M40 38 L62 53 M40 62 L24 88 M40 62 L56 88" stroke="'+c+'" stroke-width="8" stroke-linecap="round" fill="none"/></svg>'}
roster.forEach((f,i)=>{let d=document.createElement('div');d.className='card'+(i===chosen?' selected':'');d.innerHTML='<div class="preview">'+fighterSVG(f.color)+'</div><b>'+f.name+'</b><small>'+f.skill+'</small>';d.onclick=()=>{chosen=i;document.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('selected',j===i))};$('roster').appendChild(d)});
function fit(){let r=canvas.getBoundingClientRect();canvas.width=Math.floor(r.width*devicePixelRatio);canvas.height=Math.floor(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',fit);fit();
function createActor(i,team,human,slot=0){
let fi=(chosen+i)%roster.length;
return {id:i,team,human,slot,x:0,y:0,vx:0,vy:0,hp:100,face:1,ground:false,stun:0,attack:0,cool:0,special:0,fusion:0,fused:0,alive:true,character:roster[fi],weapon,combo:0,flash:0,fusionData:null,rig:{armL:0,armR:0,legL:0,legR:0,torso:0}};
}
function start(){
mode=$('mode').value;playerSlots=+$('players').value;weapon=$('weapon').value;actors=[];particles=[];matchOver=false;
if(mode==='duo'){actors=[createActor(0,0,true,0),createActor(1,1,playerSlots===1,playerSlots===2?1:0)];if(playerSlots===2)actors[1].human=true}
if(mode==='teams'){actors=[createActor(0,0,true,0),createActor(1,1,playerSlots===1,0),createActor(2,0,playerSlots===2?true:false,1),createActor(3,1,true,1)];if(playerSlots===1){actors[2].human=false;actors[3].human=false}else{actors[1].human=true;actors[2].human=true;actors[3].human=false}}
if(mode==='free'){actors=[createActor(0,0,true),createActor(1,1,playerSlots===2),createActor(2,2,false),createActor(3,3,false)]}
const w=innerWidth;actors.forEach((a,i)=>{a.x=w*(.16+i*.22);a.y=innerHeight*.65;a.face=a.x<w/2?1:-1});
$('menu').style.display='none';$('game').style.display='block';$('overlay').style.display='none';$('controls2').style.display=playerSlots===2?'flex':'none';fit();gameOn=true;last=performance.now();requestAnimationFrame(loop);
}
$('start').onclick=start;$('rematch').onclick=start;$('back').onclick=menu;$('pause').onclick=menu;
function menu(){gameOn=false;$('game').style.display='none';$('menu').style.display='grid';$('overlay').style.display='none';held={}}
function setInput(player,action,value){held['p'+player+'_'+action]=value}
document.querySelectorAll('[data-player-act]').forEach(b=>{
const p=b.dataset.playerAct,action=b.dataset.act;
const down=e=>{e.preventDefault();setInput(p,action,true);b.setPointerCapture?.(e.pointerId)};
const up=e=>{e.preventDefault();setInput(p,action,false)};
b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,up));
});
document.querySelectorAll('.joy-wrap').forEach(pad=>{
const player=pad.dataset.player,stick=pad.querySelector('.joy-stick');let active=null;
function move(e){const r=pad.getBoundingClientRect(),dx0=e.clientX-(r.left+r.width/2),dy0=e.clientY-(r.top+r.height/2),max=r.width*.29,len=Math.hypot(dx0,dy0),scale=len>max?max/len:1,dx=dx0*scale,dy=dy0*scale;stick.style.transform='translate('+dx+'px,'+dy+'px)';setInput(player,'joyX',dx/max);setInput(player,'joyY',dy/max)}
function reset(){active=null;stick.style.transform='translate(0,0)';setInput(player,'joyX',0);setInput(player,'joyY',0)}
pad.addEventListener('pointerdown',e=>{e.preventDefault();active=e.pointerId;pad.setPointerCapture(e.pointerId);move(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pad.addEventListener(ev,reset));
});
addEventListener('keydown',e=>{held[e.key.toLowerCase()]=true;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>held[e.key.toLowerCase()]=false);
function controls(a){
if(!a.human){ai(a);return}
const p=a.slot+1,joyX=Number(held['p'+p+'_joyX']||0),joyY=Number(held['p'+p+'_joyY']||0);
let left,right,jump,attack,special,fuse;
if(p===1){left=held.a||joyX<-.22;right=held.d||joyX>.22;jump=held.w||held['p1_jump']||joyY<-.65;attack=held.f||held['p1_attack'];special=held.g||held['p1_special'];fuse=held.e||held['p1_fuse']}
else{left=held.arrowleft||joyX<-.22;right=held.arrowright||joyX>.22;jump=held.arrowup||held['p2_jump']||joyY<-.65;attack=held['/']||held['p2_attack'];special=held['.']||held['p2_special'];fuse=held.enter||held['p2_fuse']}
a.vx=(right?3.7:0)-(left?3.7:0);if(a.vx)a.face=Math.sign(a.vx);
if(jump&&a.ground){a.vy=-10.5;a.ground=false}
if(attack&&!a.attack&&!a.cool){a.attack=weapon==='staff'?24:18;a.cool=weapon==='blaster'?30:20}
if(special&&!a.special){a.special=1;specialMove(a)}
if(fuse&&!a.fused)doFuse(a);
}
function ai(a){
let targets=actors.filter(b=>b.alive&&b.team!==a.team);
if(!targets.length)return;let t=targets.reduce((best,x)=>Math.abs(x.x-a.x)<Math.abs(best.x-a.x)?x:best);
a.face=t.x>a.x?1:-1;let dx=t.x-a.x;
a.vx=Math.abs(dx)>65?a.face*2.4:0;
if(Math.abs(dx)<100&&Math.abs(t.y-a.y)<90&&!a.attack&&!a.cool){a.attack=18;a.cool=24}
if(a.ground&&Math.abs(dx)<100&&Math.random()<.012)a.vy=-9;
if(!a.special&&Math.abs(dx)<180&&Math.random()<.003){a.special=1;specialMove(a)}
if(!a.fused&&Math.abs(dx)<150&&Math.random()<.002)doFuse(a);
}
function specialMove(a){
a.special=35;
if(a.character.name==='Astra'){for(let b of actors)if(enemy(a,b)&&Math.abs(b.x-a.x)<160){damage(a,b,22);b.vx=a.face*7}burst(a,a.character.color,18)}
else if(a.character.name==='Glacier'){for(let b of actors)if(enemy(a,b)&&Math.abs(b.x-a.x)<210){damage(a,b,16);b.stun=45;b.vx=a.face*2}burst(a,'#8beaff',22)}
else if(a.character.name==='Rift'){a.x+=a.face*105;for(let b of actors)if(enemy(a,b)&&Math.abs(b.x-a.x)<85)damage(a,b,28);burst(a,'#c9a0ff',14)}
else{let b=actors.filter(x=>enemy(a,x)).sort((x,y)=>Math.abs(x.x-a.x)-Math.abs(y.x-a.x))[0];if(b){let dir=Math.sign(b.x-a.x);for(let n=0;n<5;n++)particles.push({x:a.x,y:a.y-40,vx:dir*7,vy:(n-2)*1.2,life:35,color:'#b7ff7a',size:5,shot:true,owner:a})}}
}
function enemy(a,b){return a!==b&&b.alive&&(mode==='free'||a.team!==b.team)}
function doFuse(a){
if(a.fused||a.fusionLock)return;
let ally=actors.find(b=>b!==a&&b.alive&&b.team===a.team&&!b.fused&&Math.abs(b.x-a.x)<145&&Math.abs(b.y-a.y)<100);
if(!ally){a.fusionLock=18;return}
const first=a.character,second=ally.character;
a.fusionData={first,second,weaponA:a.weapon||weapon,weaponB:ally.weapon||weapon,hpBonus:ally.hp};
a.fused=1;a.fusion=99999;a.character={name:first.name+'-'+second.name,color:first.color,skill:first.skill+' + '+second.skill};
a.weapon=a.fusionData.weaponA;
a.hp=Math.min(180,a.hp+ally.hp*.65);
a.vx=(a.vx+ally.vx)*.5;a.vy=Math.min(a.vy,ally.vy)-2;
ally.alive=false;ally.fused=2;ally.fusion=0;
burst({x:(a.x+ally.x)/2,y:Math.min(a.y,ally.y)-40},'#f3e5ff',55);
a.fusionLock=60;
}

function damage(from,to,n){if(to.stun>0)return;to.hp=Math.max(0,to.hp-n);to.stun=14;to.flash=10;to.vx=from.face*5;to.vy=-3.5;shake=5;if(to.hp===0)to.alive=false;burst(to,'#fff',8)}
function burst(a,color,count){for(let i=0;i<count;i++)particles.push({x:a.x,y:a.y-35,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:25,color,size:3+Math.random()*4})}
function update(dt){
const floor=innerHeight-80;
actors.forEach(a=>{
if(!a.alive)return;
if(a.stun>0){a.stun-=dt;a.vx*=.92}else controls(a);
a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=.55*dt;
if(a.y>floor-90){a.y=floor-90;a.vy=0;a.ground=true}else a.ground=false;
a.x=Math.max(24,Math.min(innerWidth-24,a.x));a.vx*=.84;

// Spring-driven skeletal pose: limbs smoothly follow movement, jumping and attacks.
const rig=a.rig, run=Math.max(-1,Math.min(1,a.vx/4));
const targetArmL=-run*.65,targetArmR=run*.65+(a.attack>0?-1.5:0);
const targetLegL=run*.8+(a.ground?0:-.8),targetLegR=-run*.8+(a.ground?0:.8);
const stiffness=Math.min(1,.22*dt);
rig.armL+=(targetArmL-rig.armL)*stiffness;rig.armR+=(targetArmR-rig.armR)*stiffness;
rig.legL+=(targetLegL-rig.legL)*stiffness;rig.legR+=(targetLegR-rig.legR)*stiffness;
rig.torso+=((a.vy<0?-.12:a.vy>2?.12:0)-rig.torso)*stiffness;
a.attack=Math.max(0,a.attack-dt);a.cool=Math.max(0,a.cool-dt);a.special=Math.max(0,a.special-dt);a.fusionLock=Math.max(0,(a.fusionLock||0)-dt);a.flash=Math.max(0,a.flash-dt);
if(a.attack>0&&a.attack<16&&a.attack>12&&!a.hitDone){a.hitDone=true;let range=weapon==='staff'?105:weapon==='blaster'?260:75;
actors.forEach(b=>{if(enemy(a,b)&&Math.abs(b.x-a.x)<range&&Math.abs(b.y-a.y)<85&&Math.sign(b.x-a.x)===a.face){if(weapon==='blaster'){b.hp=Math.max(0,b.hp-10);b.stun=8;b.vx=a.face*2;if(!b.hp)b.alive=false;burst({x:b.x,y:b.y},'#ffe58a',7)}else damage(a,b,weapon==='staff'?13:17)}})}
if(a.attack===0)a.hitDone=false;
});
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.shot){let b=actors.find(x=>enemy(p.owner,x)&&Math.abs(x.x-p.x)<18&&Math.abs(x.y-p.y)<65);if(b){damage(p.owner,b,12);p.life=0}}});
particles=particles.filter(p=>p.life>0);
let living=actors.filter(a=>a.alive),teams=new Set(living.map(a=>a.team));
if(!matchOver&&(living.length<=1||mode!=='free'&&teams.size<=1)){matchOver=true;gameOn=false;$('overlay').style.display='grid';$('winner').textContent=living.length?living[0].team===0?'BLUE TEAM WINS':'RED TEAM WINS':'DRAW';$('resultinfo').textContent=living.length?living[0].character.name+' survived the battle.':'Everyone was knocked out.'}
updateHUD();
}
function updateHUD(){
let left=actors.find(a=>a.team===0)||actors[0],right=actors.find(a=>a.team!==left.team)||actors[1];
$('leftname').textContent=(left.human?'P1 · ':'')+left.character.name+(left.fused?' · FUSED':'');
$('rightname').textContent=(right.human?'P2 · ':'')+right.character.name+(right.fused?' · FUSED':'');
$('leftbar').style.width=left.hp+'%';$('rightbar').style.width=right.hp+'%';
$('leftbar').style.background=left.hp<30?'#ff6565':'#65e29b';$('rightbar').style.background=right.hp<30?'#ff6565':'#65e29b';
}
function drawActor(a){
const r=a.rig,c=a.flash?'#fff':a.character.color;
ctx.save();ctx.translate(a.x,a.y);ctx.scale(a.face,1);ctx.rotate(r.torso);
ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=c;ctx.fillStyle=c;
// A simple articulated skeleton: head, spine, shoulders, elbows, hips, knees and feet.
const head={x:0,y:-75},neck={x:0,y:-59},shoulderL={x:-12,y:-52},shoulderR={x:12,y:-52},hipL={x:-7,y:-24},hipR={x:7,y:-24};
function joint(x,y){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill()}
function bone(a,b,width=7){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();joint(a.x,a.y);joint(b.x,b.y)}
function limb(start,angle,len){return{x:start.x+Math.sin(angle)*len,y:start.y+Math.cos(angle)*len}}
const elbowL=limb(shoulderL,r.armL,19),handL=limb(elbowL,r.armL-.35,19);
const elbowR=limb(shoulderR,r.armR,19),handR=limb(elbowR,r.armR-.35,20);
const kneeL=limb(hipL,r.legL,20),footL=limb(kneeL,r.legL+.25,19);
const kneeR=limb(hipR,r.legR,20),footR=limb(kneeR,r.legR+.25,19);
ctx.beginPath();ctx.arc(head.x,head.y,13,0,Math.PI*2);ctx.fill();
bone(neck,{x:0,y:-25},9);bone(shoulderL,shoulderR,8);bone(shoulderL,elbowL);bone(elbowL,handL);bone(shoulderR,elbowR);bone(elbowR,handR);bone(hipL,hipR,8);bone(hipL,kneeL);bone(kneeL,footL);bone(hipR,kneeR);bone(kneeR,footR);
// Weapon follows the right hand joint rather than a fixed torso point.
ctx.strokeStyle=weapon==='blaster'?'#ffd86b':weapon==='staff'?'#c7a6ff':'#e8edf8';ctx.lineWidth=weapon==='staff'?5:4;
ctx.beginPath();if(weapon==='sword'){ctx.moveTo(handR.x,handR.y);ctx.lineTo(handR.x+24,handR.y-30)}else if(weapon==='staff'){ctx.moveTo(handR.x-4,handR.y-38);ctx.lineTo(handR.x+4,handR.y+35)}else{ctx.moveTo(handR.x,handR.y);ctx.lineTo(handR.x+22,handR.y);ctx.lineTo(handR.x+22,handR.y-9);ctx.lineTo(handR.x+32,handR.y-9);ctx.lineTo(handR.x+32,handR.y+9);ctx.lineTo(handR.x+22,handR.y+9)}ctx.stroke();
if(a.attack>0){ctx.strokeStyle='#ffffffaa';ctx.lineWidth=4;ctx.beginPath();ctx.arc(20,-40,weapon==='staff'?55:42,-1.25,1.25);ctx.stroke()}
if(a.fusion>0){ctx.strokeStyle='#e9d6ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-40,49,0,Math.PI*2);ctx.stroke()}
ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(a.human?'P'+(a.slot+1):'CPU',a.x,a.y-105);
}
function draw(){
let w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);
let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#171b2c');grad.addColorStop(1,'#34314b');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
ctx.fillStyle='#242638';ctx.fillRect(0,h-80,w,80);ctx.strokeStyle='#77758e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,h-80);ctx.lineTo(w,h-80);ctx.stroke();
ctx.globalAlpha=.13;ctx.strokeStyle='#c9c2ff';for(let x=0;x<w;x+=70){ctx.beginPath();ctx.moveTo(x,h-80);ctx.lineTo(x+35,h);ctx.stroke()}ctx.globalAlpha=1;
particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size||4,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
actors.forEach(a=>a.alive&&drawActor(a));
}
function loop(t){if(!gameOn)return;let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}
</script>
